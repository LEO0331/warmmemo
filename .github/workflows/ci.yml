name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify backend dependency security and compatibility
        run: |
          npm ci --prefix server --ignore-scripts
          npm ci --prefix functions --ignore-scripts
          node --test tools/node_security.test.cjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify crawlable SEO files
        run: node tools/verify_seo.mjs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
