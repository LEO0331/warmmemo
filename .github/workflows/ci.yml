name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify backend dependency security and compatibility
        run: |
          npm ci --prefix server --ignore-scripts
          npm ci --prefix functions --ignore-scripts
          node --test tools/node_security.test.cjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Flutter 3.50 deprecates the SDK Material imports used by the app.
          flutter-version: '3.47.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify crawlable SEO files
        run: node tools/verify_seo.mjs

      - name: Analyze
        run: flutter analyze

      - name: Test coverage checker
        run: node --test tools/check_flutter_coverage.test.mjs

      - name: Test Flutter with coverage
        id: flutter_tests
        run: flutter test --coverage

      - name: Enforce Flutter line coverage
        shell: bash
        env:
          MIN_FLUTTER_LINE_COVERAGE: '92'
        run: |
          node tools/check_flutter_coverage.mjs coverage/lcov.info "$MIN_FLUTTER_LINE_COVERAGE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Flutter LCOV
        if: ${{ !cancelled() && steps.flutter_tests.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
